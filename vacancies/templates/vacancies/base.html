{% load static %}

<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="theme-color" content="#131615">
    <meta name="color-scheme" content="dark">

    <title>{% block title %} SkillLence {% endblock %}</title>
    <link rel="stylesheet"
          href="{% static 'vacancies/css/style.css' %}"
    />
</head>
<body>
    <nav>
        {% block header_content %}
            <a href="{% url 'vacancy-about-app' %}">Главная</a>
        {% endblock %}
        {% if user.is_authenticated %}
            <form action="" method="post" class="logout-form">
                {% csrf_token %}
                <button type="submit" class="btn btn--text">Выйти</button>
            </form>
        {% else %}
            <a href="" class="btn btn--filled">Войти</a>
        {% endif %}
    </nav>

    <main>
        {% block content %}{% endblock %}
    </main>

    <footer>© 2026</footer>

</body>
</html>
